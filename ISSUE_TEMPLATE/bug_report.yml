name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please provide as much context as possible.

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: What version or Git commit of the tool/project are you running?
      placeholder: e.g. v1.0.2 / main branch @ abc1234
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & OS
      description: OS, Go/Python version, Kubernetes version, Docker version, etc.
      placeholder: e.g. Linux Ubuntu 22.04 / Go 1.23 / k8s v1.30
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. Pass config '...'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Screenshots
      description: Paste any error messages, stack traces, or console output.
      render: shell
